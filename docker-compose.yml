# ─────────────────────────────────────────────────────────────────────────
# ttp-similarity-engine -- docker-compose.yml
#
#   docker compose up --build                     # istasyon: http://localhost:8000
#   docker compose --profile setup run --rm setup # veri + motor + benchmark (istege bagli)
#   docker compose down
#
# data/ ve outputs/ host ile paylasilir; derlenen veri kalicidir.
# ─────────────────────────────────────────────────────────────────────────

services:

  app:
    build:
      context: .
      target: final
    image: ttp-similarity-engine:latest
    container_name: yildiz-istasyon
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./outputs:/app/outputs
    restart: unless-stopped

  # Veriyi ve motoru acikca derler, ardindan Guven ekranini besleyen
  # uc zorluk rejimini kosar.
  setup:
    image: ttp-similarity-engine:latest
    profiles:
      - setup
    volumes:
      - ./data:/app/data
      - ./outputs:/app/outputs
    command: >
      sh -c "
        python -m ttp_similarity.data.build --dataset attck &&
        python -m ttp_similarity.engine.build --dataset attck &&
        python -m ttp_similarity.evaluation.benchmark --dataset attck --regimes &&
        echo '==> Tamam. Istasyon: docker compose up app'
      "
